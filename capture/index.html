<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>MyAIValet | Capture</title><script src="/capture/capture.js" defer></script>
<style>body{font-family:system-ui;max-width:520px;margin:40px auto;padding:0 20px}input,button{display:block;width:100%;padding:12px;margin:8px 0;font-size:16px}.hp{position:absolute;left:-9999px}</style></head><body>
<h1>Get your AI concierge</h1>
<form id="capture-form" novalidate>
<input name="website" placeholder="yourbusiness.com" autocomplete="url">
<input name="first_name" placeholder="First name (optional)"><input name="last_name" placeholder="Last name (optional)">
<input name="email" type="email" placeholder="Email (optional)"><input name="phone" type="tel" placeholder="Phone (optional)">
<div class="hp" aria-hidden="true"><input name="company_fax" tabindex="-1" autocomplete="off"></div>
<button type="submit">Send</button><p data-msg role="status"></p></form></body></html>
